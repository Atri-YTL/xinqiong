<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>群聊与记忆 · Atri控制台</title>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="nav.js"></script>
    <style>
      :root {
        --bg: #0d1014; --panel: #14181f; --card: #171c25; --line: #232a35;
        --text: #d7dee9; --dim: #7d8899; --accent: #7dd3fc;
        --ok: #4ade80; --warn: #f5c26b; --bad: #ff7b72;
        --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { color: var(--text); font: 13px/1.55 var(--mono); display: flex; flex-direction: column; overflow: hidden; }
      html, body { background: #0b0e12; }
      main {
        flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px;
        background:
          radial-gradient(125% 95% at 50% 0%,
            rgba(9,13,19,.30) 0%, rgba(8,10,14,.68) 52%, rgba(7,9,12,.86) 100%),
          #0b0e12 url("./bg.jpg") center / cover no-repeat;
      }
      header {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 10px 14px; background: rgba(15,19,25,.62);
        border-bottom: 1px solid var(--line); flex: 0 0 auto;
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        position: relative; z-index: 1;
      }
      header h1 { font-size: 13px; margin: 0; color: var(--accent); font-weight: 600; }
      .spacer { flex: 1 1 auto; }
      button {
        font: inherit; font-size: 12px; color: var(--text); background: rgba(27,33,43,.78);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer;
      }
      button:hover { border-color: #3a4657; }
      button.primary { border-color: #2a5a5e; color: #a5f3fc; background: rgba(16,34,39,.8); }
      .tabs { display: flex; gap: 4px; overflow-x: auto; max-width: 62vw; }
      .tabs button {
        background: transparent; border: 1px solid transparent; border-radius: 999px;
        padding: 4px 10px; color: var(--dim); white-space: nowrap;
      }
      .tabs button:hover { color: var(--text); border-color: var(--line); }
      .tabs button.active { color: var(--accent); border-color: #24505f; background: rgba(16,34,39,.72); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
      .card {
        background: rgba(19,24,31,.62); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px 14px;
      }
      .card h2 { font-size: 13px; margin: 0 0 2px; }
      .card .note { color: var(--dim); font-size: 11.5px; margin: 0 0 10px; }
      .row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
      .row label { flex: 0 0 auto; min-width: 132px; color: var(--text); font-size: 12.5px; }
      .row .hint { color: var(--dim); font-size: 11px; }
      .row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #7dd3fc; }
      .row input[type="number"], .row input[type="text"] {
        background: rgba(10,14,20,.7); border: 1px solid var(--line);
        border-radius: 6px; color: var(--text); padding: 4px 8px; font: inherit; font-size: 12px;
      }
      .row input[type="number"] { width: 90px; }
      .row input[type="text"] { flex: 1 1 auto; min-width: 120px; }
      #banner {
        display: none; margin: 0 0 12px; padding: 9px 12px;
        border: 1px solid #5a3d22; background: #251a10; color: var(--warn);
        border-radius: 8px; font-size: 12px;
      }
      #banner.show { display: block; }
      #status { font-size: 12px; }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }
    
      /* ── 窄屏（手机）适配 ── */
      @media (max-width: 720px) {
        header { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
        header h1 { font-size: 12px; flex: 0 0 auto; }
        .tabs {
          order: 9; width: 100%; max-width: 100%;
          -webkit-overflow-scrolling: touch;
        }
        .tabs button { padding: 6px 12px; font-size: 12px; }
        main { flex-direction: column; padding: 10px; gap: 10px; }
        aside { flex: 0 0 auto; max-height: 26vh; width: 100%; }
        .grid { grid-template-columns: 1fr; }
        .row { flex-wrap: wrap; }
        .row label { flex: 1 1 100%; min-width: 0; }
        .row input[type="number"] { width: 110px; }
        .row input[type="text"] { flex: 1 1 100%; }
        .card, .item, .stat { padding: 10px 11px; }
        textarea { min-height: 220px; }
        .pane { flex: 1 1 auto !important; }
        .pane.p1, .pane.p2 { flex: 0 0 auto !important; max-height: 20vh; }
        pre.check { max-height: 42vh; }
        #cards { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>群聊与记忆</h1>
      <nav class="tabs" id="tabs"></nav>
      <span class="spacer"></span>
      <span id="status"></span>
      <button id="saveRestart">保存并重启</button>
      <button class="primary" id="save">保存</button>
    </header>

    <main>
      <div id="banner"></div>
      <div class="grid" id="groups"></div>
    </main>

    <script>
        function selfNavigate(page){ if(window.__NAV__ && window.__NAV__[page]){ location.href = window.__NAV__[page]; } }

      (function () {
        "use strict";

        var PAGES = [
          ["status", "状态"], ["logs", "日志"], ["ops", "运维"],
          ["groups", "群聊"], ["memory", "记忆"], ["slang", "梗库"],
          ["content", "内容"], ["maint", "维护"], ["period", "时段"],
          ["growth", "成长"], ["persona", "角色卡"], ["star", "心穹中枢"]
        ];
        var CURRENT = "groups";
        var PLUGIN = "astrbot_plugin_console";
        var bridge = null;
        var bannerEl = document.getElementById("banner");

        function banner(text) { bannerEl.textContent = text; bannerEl.classList.add("show"); }
        function clearBanner() { bannerEl.classList.remove("show"); }
        function setStatus(text, tone) {
          var el = document.getElementById("status");
          el.textContent = text || "";
          el.className = tone || "";
        }

        function renderTabs() {
          var nav = document.getElementById("tabs");
          PAGES.forEach(function (pair) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = pair[1];
            if (pair[0] === CURRENT) btn.classList.add("active");
            btn.addEventListener("click", function () {
              try { selfNavigate(pair[0]); }
              catch (e) { banner("宿主不允许切换页面：" + e); }
            });
            nav.appendChild(btn);
          });
        }

        function buildField(field, store) {
          var row = document.createElement("div");
          row.className = "row";
          var label = document.createElement("label");
          label.textContent = field.label;
          row.appendChild(label);

          var input;
          if (field.type === "bool") {
            input = document.createElement("input");
            input.type = "checkbox";
            input.checked = !!field.value;
            input.addEventListener("change", function () { store[field.key] = input.checked; });
          } else if (field.type === "list") {
            input = document.createElement("input");
            input.type = "text";
            input.value = (field.value || []).join(", ");
            input.addEventListener("input", function () {
              store[field.key] = input.value;
            });
          } else {
            input = document.createElement("input");
            input.type = "number";
            input.value = field.value;
            if (field.min !== undefined) input.min = field.min;
            if (field.max !== undefined) input.max = field.max;
            input.addEventListener("input", function () { store[field.key] = input.value; });
          }
          input.dataset.key = field.key;
          row.appendChild(input);

          var rangeHint = "";
          if (field.type === "int" && field.min !== undefined && field.max !== undefined) {
            rangeHint = "范围 " + field.min + "–" + field.max;
          }
          if (field.hint || rangeHint) {
            var hint = document.createElement("span");
            hint.className = "hint";
            hint.textContent = [field.hint, rangeHint].filter(Boolean).join(" · ");
            row.appendChild(hint);
          }
          return row;
        }

        var state = { files: {}, nodes: {} };

        function render(groups) {
          var box = document.getElementById("groups");
          box.replaceChildren();
          state.files = {};
          state.nodes = {};
          groups.forEach(function (group) {
            var store = {};
            state.files[group.file] = store;
            var card = document.createElement("section");
            card.className = "card";
            var h = document.createElement("h2");
            h.textContent = group.title;
            card.appendChild(h);
            if (group.note) {
              var note = document.createElement("p");
              note.className = "note";
              note.textContent = group.note;
              card.appendChild(note);
            }
            group.fields.forEach(function (field) { card.appendChild(buildField(field, store)); });
            box.appendChild(card);
          });
        }

        async function load() {
          if (!bridge) return;
          setStatus("读取中…");
          try {
            var d = await bridge.apiGet("groups");
            render((d && d.groups) || []);
            clearBanner();
            setStatus("");
          } catch (error) {
            banner("读配置失败：" + (error && error.message ? error.message : error));
            setStatus("");
          }
        }

        async function save() {
          if (!bridge) return;
          var btn = document.getElementById("save");
          btn.disabled = true;
          setStatus("保存中…");
          try {
            var payload = {};
            Object.keys(state.files).forEach(function (file) {
              var out = {};
              Object.keys(state.files[file]).forEach(function (k) {
                var v = state.files[file][k];
                out[k] = typeof v === "string" ? v : v;
              });
              payload[file] = out;
            });
            var r = await bridge.apiPost("groups/save", { files: payload });
            var files = (r && r.files) || [];
            setStatus("已保存 · " + files.length + " 个文件（写前已快照）", "ok");
            clearBanner();
            await load();
          } catch (error) {
            setStatus("保存失败", "bad");
            banner("保存失败：" + (error && error.message ? error.message : error));
          } finally {
            btn.disabled = false;
          }
        }

        function boot(attempt) {
          bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
          if (!bridge) {
            if (attempt < 30) { setTimeout(function () { boot(attempt + 1); }, 100); return; }
            banner("没有检测到 AstrBot 页面桥 —— 请从 WebUI → 扩展功能 → Atri控制台 → 群聊 进入。");
            return;
          }
          renderTabs();
          document.getElementById("save").addEventListener("click", save);
          document.getElementById("saveRestart").addEventListener("click", async function () {
            if (!confirm("保存后重启机器人？页面会短暂失联，约 20–40 秒回来。")) return;
            await save();
            setStatus("已保存，正在重启…", "ok");
            try {
              await bridge.apiPost("ops/restart", { confirm: "restart" });
            } catch (e) {
              setStatus("重启指令失败：见提示", "bad");
              banner("重启失败：" + (e && e.message ? e.message : e));
            }
          });
          var start = function () { load(); };
          if (typeof bridge.ready === "function") {
            Promise.race([bridge.ready(), new Promise(function (r) { setTimeout(r, 1500); })]).finally(start);
          } else { start(); }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { boot(0); });
        } else { boot(0); }
      })();
    </script>
  </body>
</html>
