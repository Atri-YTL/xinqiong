      function onTimeline(v){
        var idx = parseInt(v, 10);
        if (isNaN(idx)) return;
        if (idx >= allDates.length - 1){
          timeCutoff = "";
        } else {
          timeCutoff = allDates[idx] || "";
        }
        updateTimelineLabel();
      }

      // ---------- 准实时：轮询同目录的 data.json ----------
      var liveUpdatedAt = "", liveWarm = false, liveTimer = null;

      function pollLive(){
        if (document.hidden) return;
        fetch("data.json?t=" + Date.now(), { cache: "no-store" })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){
            if (!j || !j.updated_at || j.updated_at === liveUpdatedAt) return;
            liveUpdatedAt = j.updated_at;
            if (!liveWarm){ liveWarm = true; return; }   // 第一次拿到只记时间戳，画面已经是新的
            if (loadedOnce && j.data) renderGraph(j.data, true);
          })
          .catch(function(){ /* 没网/没文件就安静跳过 */ });
      }

      // ---------- 回放：从原意识开始，一颗一颗长出来 ----------
      function buildPlayOrder(){
        play.order = nodes.filter(function(n){ return !n.root; })
          .slice()
          .sort(function(a, b){
            var da = String(a.date || ""), db = String(b.date || "");
            if (da !== db) return da < db ? -1 : 1;
            return String(a.id) < String(b.id) ? -1 : 1;
          })
          .map(function(n){ return n.id; });
      }

      function startPlay(){
        buildPlayOrder();
        if (!play.order.length) return;
        play.on = true;
        play.idx = 0;
        play.t = performance.now();
        play.revealAt = {};
        play.nodePulse = {};
        play.linkPulse = {};
        play.linkColor = {};
        play.finaleAt = 0;
        autoSpin = false;
        spinEl.textContent = "开始自转";
        lanternOff();
        selected = null;
        highlightSet = {};
        focusLinks = {};
        showPanel(null);
        if (playEl) playEl.textContent = "■ 停止";
        if (tlEl){ tlEl.value = tlEl.max; onTimeline(tlEl.value); }
      }

      function stopPlay(){
        play.on = false;
        if (playEl) playEl.textContent = "▶ 回放";
      }

      function stepPlay(now){
        if (!play.on) return;
        if (now - play.t < play.step) return;
        play.t = now;
        if (play.idx >= play.order.length){
          if (!play.finaleAt) play.finaleAt = now;      // 收尾：所有线一起亮一下
          if (now - play.finaleAt > 7200) stopPlay();
          return;
        }
        var id = play.order[play.idx++];
        play.revealAt[id] = now;
        play.nodePulse[id] = now;
        // 新星亮起时，把它已经连着的旧星也带亮一下
        (adj[id] || []).forEach(function(other){
          if (other === "__self__") return;
          if (!play.revealAt[other]) return;
          play.nodePulse[other] = now;
          var k1 = id + ">" + other, k2 = other + ">" + id;
          play.linkPulse[k1] = now;
          play.linkPulse[k2] = now;
          // 过程里的线也按情绪上色（同情绪用那对情绪色，否则用新星自己的情绪色）
          var nNode = byId[id], oNode = byId[other];
          var sameMood = (nNode.mood || "平静") === (oNode.mood || "平静");
          var col = MOOD_COLORS[sameMood ? (nNode.mood || "平静") : (nNode.mood || "平静")] || "#ffd76a";
          play.linkColor[k1] = col;
          play.linkColor[k2] = col;
        });
      }

      function drawPlayFlash(now){
        if (!play.on) return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        // 刚出生的星：一圈扩散的环
        Object.keys(play.revealAt).forEach(function(id){
          var age = now - play.revealAt[id];
          if (age > 900) return;
          var n = byId[id];
          if (!n) return;
          var p = age / 900;
          var r0 = Math.max(2, n.size * 0.5 * (n.sk || 1));
          ctx.strokeStyle = MOOD_COLORS[n.mood || "平静"] || "#ffd76a";
          ctx.globalAlpha = Math.min(0.8, 0.7 * (1 - p));
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(n.sx, n.sy, r0 + 26 * p, 0, Math.PI * 2); ctx.stroke();
        });
        ctx.restore();
      }

      // 回放结束的「宏观」：先是 7 种情绪一个接一个亮，最后整张网一起亮
      function drawPlayFinale(now){
        if (!play.on || !play.finaleAt) return;
        var age = now - play.finaleAt;
        if (age < 0) return;

        var STEP = 520;          // 每种情绪间隔
        var EACH = 1700;         // 单种情绪的亮起时长（含两次呼吸）
        var GROUP_N = 7;

        // 每种情绪各自的包络（按真实存在的情绪排队）
        // 固定按图例顺序排队：亲近 → 好奇 → 开心 → 担心 → 认真 → 委屈 → 平静
        var MOOD_ORDER = ["亲近", "好奇", "开心", "担心", "认真", "委屈", "平静"];
        var present = {};
        nodes.forEach(function(n){ if (!n.root) present[n.mood || "平静"] = 1; });
        var moods = MOOD_ORDER.filter(function(m){ return present[m]; });

        var groupEnv = {};
        moods.forEach(function(m, i){
          var t0 = i * STEP, t1 = t0 + EACH;
          if (age < t0 || age > t1) { groupEnv[m] = 0; return; }
          var p2 = (age - t0) / EACH;
          var window_ = Math.pow(Math.sin(Math.PI * p2), 0.55);       // 整体起落
          var breathe = 0.45 + 0.55 * (0.5 - 0.5 * Math.cos(p2 * Math.PI * 4));  // 呼吸两下
          groupEnv[m] = window_ * breathe;
        });

        // 全部一起亮的阶段：等最后一个情绪亮完再开始
        var allStart = moods.length * STEP + EACH * 0.55;
        var allDur = 2600;
        var allEnv = 0;
        if (age > allStart){
          var q = Math.min(1, (age - allStart) / allDur);
          var w2 = Math.pow(Math.sin(Math.PI * q), 0.5);
          var b2 = 0.45 + 0.55 * (0.5 - 0.5 * Math.cos(q * Math.PI * 4));   // 呼吸两下
          allEnv = w2 * b2;
        }
        if (moods.length * STEP + EACH < allStart + allDur && age > allStart + allDur) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        links.forEach(function(l){
          if (l.root) return;
          var a = byId[l.source], b = byId[l.target];
          if (!a || !b || a.root || b.root) return;
          var ma = a.mood || "平静", mb = b.mood || "平静";
          var same = ma === mb;
          var env = same ? Math.max(groupEnv[ma] || 0, allEnv) : allEnv;
          if (env <= 0.01) return;
          var col = same ? (MOOD_COLORS[ma] || "#ffd76a") : "#ffd76a";
          ctx.strokeStyle = col;
          ctx.globalAlpha = Math.min(0.30, 0.30 * env);
          ctx.lineWidth = 1.8 + 2.0 * env;
          ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
          ctx.globalAlpha = Math.min(0.75, 0.75 * env);
          ctx.lineWidth = 0.7 + 0.8 * env;
          ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
        });
        ctx.restore();
        ctx.globalAlpha = 1;
        play.finaleMoods = moods;
      }

      function drawPlayLinks(now){
        if (!play.on) return;
        ctx.save();
        ctx.globalCompositeOperation = "source-over";   // 正常混合，颜色才不会被叠加成白
        Object.keys(play.linkPulse).forEach(function(key){
          var t = play.linkPulse[key];
          var age = now - t;
          if (age > 1100) return;
          var ids = key.split(">");
          var a = byId[ids[0]], b = byId[ids[1]];
          if (!a || !b) return;
          var k = Math.sin(Math.PI * (age / 1100));
          ctx.strokeStyle = play.linkColor[key] || "#ffd76a";
          ctx.globalAlpha = Math.min(0.95, 0.8 * k);
          ctx.lineWidth = 1 + 1.4 * k;
          ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
        });
        ctx.restore();
      }

      function startLivePoll(){
        if (liveTimer) return;
        pollLive();
        liveTimer = setInterval(pollLive, 6000);
      }

      function startLoad(){
        if (loadedOnce) return;
        var h = document.getElementById("hint");
        if (window.__DATA__){
          try { renderGraph(window.__DATA__); }
          catch(e){ if (h) h.textContent = "数据异常：" + (e && e.message ? e.message : e); }
          return;
        }
        if (h){
          h.textContent = "这份页面没有内联数据（插件可能刚重启，或页面令牌已过期）";
          var btn = document.createElement("button");
          btn.textContent = "重新加载";
          btn.style.marginTop = "10px";
          btn.addEventListener("click", function(){ location.reload(); });
          h.appendChild(document.createElement("br"));
          h.appendChild(btn);
        }
      }

      function boot(){
        bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
        renderTabs();
        resize();
        setTimeout(startLoad, 60);
        setTimeout(startLivePoll, 1200);
      }

      // ---------- 指针输入（鼠标 + 触屏统一，支持双指缩放） ----------
      var activePointers = new Map();
      var pinchStart = 0, pinchZoom0 = 1;

      cv.addEventListener("pointerdown", function(e){
        try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针，忽略 */ }
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size === 2){
          var pts = Array.from(activePointers.values());
          pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
          pinchZoom0 = zoom;
          dragging = false;
          return;
        }
        dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
        cv.classList.add("dragging");
      });

      function endPointer(e){
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) pinchStart = 0;
        if (activePointers.size === 0){
          if (dragging) cv.classList.remove("dragging");
          dragging = false;
        }
        if (moved){
          // 拖动结束后浏览器会补一个 click，短暂屏蔽它（否则会误选星星）
          suppressClickUntil = performance.now() + 120;
          moved = false;
        }
      }
      cv.addEventListener("pointerup", endPointer);
      cv.addEventListener("pointercancel", endPointer);
      window.addEventListener("pointerup", endPointer);

      cv.addEventListener("pointermove", function(e){
        if (activePointers.has(e.pointerId)){
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        // 双指：捏合缩放
        if (activePointers.size === 2 && pinchStart > 0){
          var pts = Array.from(activePointers.values());
          var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
          zoom = Math.max(0.6, Math.min(6, pinchZoom0 * (dist / pinchStart)));
          moved = true;
          return;
        }
        if (dragging && activePointers.size === 1){
          var dx = e.clientX - lastX, dy = e.clientY - lastY;
          if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
          // trackball：水平拖 → 绕屏幕 Y，竖直拖 → 绕屏幕 X（永不锁死）
          cam3 = matMul(rotYm(dx * 0.0042), cam3);
          cam3 = matMul(rotXm(dy * 0.0042), cam3);
          lastX = e.clientX; lastY = e.clientY;
          return;
        }
        var r = cv.getBoundingClientRect();
        hovered = pick(e.clientX - r.left, e.clientY - r.top);
        cv.style.cursor = hovered ? "pointer" : "grab";
      });

      // ---------- 复位：双击空白 / Esc ----------
      function resetView(){
        lanternOff();
        zoomed = false;
        pivot = null;
        highlightSet = {};
        focusLinks = {};
        selected = null;
        showPanel(null);
        panX = 0; panY = 0;
        zoomTo(1.0, 450, 0, 0);
        autoSpin = true;
        if (spinEl) spinEl.textContent = "停止自转";
      }

      cv.addEventListener("dblclick", function(e){
        var r = cv.getBoundingClientRect();
        var mx = e.clientX - r.left, my = e.clientY - r.top;
        var n = pick(mx, my);
        var c = coreScreenPos();
        var onCore = Math.hypot(mx - c.x, my - c.y) < Math.max(coreRadius() * 2.2, 40);
        if (!n || onCore || (n && n.root)) resetView();   // 空白 / 中心 → 全部复位并关彩蛋
      });

      window.addEventListener("keydown", function(e){
        if (e.key === "Escape"){
          resetView();
        } else if (e.key === "+" || e.key === "="){
          zoom = Math.max(0.6, Math.min(6, zoom * 1.15));
        } else if (e.key === "-"){
          zoom = Math.max(0.6, Math.min(6, zoom / 1.15));
        }
      });

      cv.addEventListener("click", function(e){
        if (performance.now() < suppressClickUntil) return;
        if (moved){ moved = false; return; }
        var r = cv.getBoundingClientRect();
        var mx = e.clientX - r.left, my = e.clientY - r.top;
        var n = pick(mx, my);
        if (!n && Math.hypot(mx - coreScreenPos().x, my - coreScreenPos().y) < Math.max(coreRadius() * 1.8, Math.min(W, H) * 0.07)){
          n = byId["__self__"] || null;
        }
        // 放大态下的点击：点同一颗 = 退出；点别的星 = 切到那颗（不退出）
        if (zoomed){
          // 放宽「点的是同一颗」的判定：落点离那颗星 26px 内都算点到它
          var sameAsSel = !!(n && selected && n.id === selected.id);
          if (!sameAsSel && selected){
            var ddx = mx - selected.sx, ddy = my - selected.sy;
            if (Math.sqrt(ddx * ddx + ddy * ddy) <= 26) sameAsSel = true;
          }
          if (sameAsSel){
            // 点的是中心：还没钻到底就继续钻
            if (selected && selected.root){ tryLantern(); }
            if (selected && selected.root && zoom < 1.3){ zoomTo(1.8, 800, 0, 0); return; }
            if (selected && selected.root && zoom < 2.2){ zoomTo(3.0, 850, 0, 0); return; }
            zoomed = false;
            pivot = null;
            zoomTo(1.0, 600, 0, 0);
            autoSpin = true;
            spinEl.textContent = "停止自转";
            highlightSet = {};
            focusLinks = {};
            selected = null;
            showPanel(null);
            return;
          }
          if (n && n.root){
            // 放大态下点中心：还没钻到底就继续钻，到底了才退出
            tryLantern();
            if (zoom < 1.3){ zoomTo(1.8, 800, 0, 0); return; }
            if (zoom < 2.2){ zoomTo(3.0, 850, 0, 0); return; }
            zoomed = false;
            zoomTo(1.0, 700, 0, 0);
            autoSpin = true;
            spinEl.textContent = "停止自转";
            selected = null;
            showPanel(null);
            return;
          }
          if (n && !n.root){
            selected = n;
            showPanel(n);
            pivot = { x: n.X, y: n.Y, z: n.Z };
            zoomTo(zoom, 520, 0, 0);
            setFocus(n);
            startFlow(n.id);
            return;
          }
          // 点到空白：什么都不做，保持放大
          return;
        }

        selected = n || null;
        showPanel(selected);
        if (n && n.root){
          burstAt = performance.now();
          selected = n;
          showPanel(n);
          autoSpin = false;
          spinEl.textContent = "开始自转";
          zoomed = true;
          if (zoom < 1.3) tryLantern();          // 彩蛋：第一次钻进中心
          // 逐步「钻进」中心：1 → 2.2 → 4.5 → 回到 1
          if (zoom < 1.3) zoomTo(1.8, 800, 0, 0);
          else if (zoom < 2.2) zoomTo(3.0, 850, 0, 0);
          else { zoomTo(1.0, 800, 0, 0); zoomed = false; autoSpin = true; spinEl.textContent = "停止自转"; }
          return;
        }
        if (n){
          zoomed = true;
          pivot = { x: n.X, y: n.Y, z: n.Z };
          zoomTo(2.8, 760, 0, 0);
          autoSpin = false;                      // 放大就定格，停止自转（想转自己拖）
          spinEl.textContent = "开始自转";
          vYaw = 0; vPitch = 0;
          setFocus(n);
          startFlow(n.id);
        } else {
          highlightSet = {};
        }
      });
      cv.addEventListener("wheel", function(e){
        e.preventDefault();
        zoom = Math.max(0.6, Math.min(12.0, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
      }, { passive: false });

      document.getElementById("toggleDim").addEventListener("click", function(){
        showDim = !showDim;
        var dim = nodes.filter(function(n){ return !n.root && n.clarity <= 0; }).length;
        this.textContent = (showDim ? "隐藏" : "显示") + "已遗忘" + (dim ? (" (" + dim + ")") : "");
      });
      var SPEEDS = [0.00030, 0.00075, 0.0016], SPEED_NAMES = ["慢", "正常", "快"], speedIdx = 0;
      document.getElementById("speed").addEventListener("click", function(){
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        spinSpeed = SPEEDS[speedIdx];
        this.textContent = "速度：" + SPEED_NAMES[speedIdx];
      });
      var tlEl = document.getElementById("tl");
      if (tlEl){
        tlEl.addEventListener("input", function(){ onTimeline(this.value); });
        tlEl.addEventListener("dblclick", function(){ this.value = this.max; onTimeline(this.value); });
      }

      // 沙箱 iframe 里没有 allow-same-origin，用 localStorage 会抛错 —— 全部包起来
      function lsGet(k){
        try { return window.localStorage.getItem(k); } catch (e) { return null; }
      }
      function lsSet(k, v){
        try { window.localStorage.setItem(k, v); } catch (e) { /* 沙箱里存不了，忽略 */ }
      }

      var speedEl = document.getElementById("playSpeed");
      if (speedEl){
        var savedSpeed = lsGet("playSpeedMs");
        if (savedSpeed) speedEl.value = savedSpeed;
        play.step = parseInt(speedEl.value, 10) || 220;
        speedEl.addEventListener("change", function(){
          play.step = parseInt(this.value, 10) || 220;
          lsSet("playSpeedMs", String(play.step));
        });
      }

      playEl = document.getElementById("play");
      playEl.addEventListener("click", function(){
        if (play.on) stopPlay(); else startPlay();
      });

      spinEl = document.getElementById("spin");
      spinEl.addEventListener("click", function(){
        autoSpin = !autoSpin;
        this.textContent = autoSpin ? "停止自转" : "开始自转";
      });
      document.getElementById("q").addEventListener("input", function(){
        query = this.value.trim().toLowerCase();
      });
      window.addEventListener("resize", function(){ resize(); if (loadedOnce) layout(); });

      (function(){
        if (document.readyState === "loading"){
          document.addEventListener("DOMContentLoaded", boot);
        } else { boot(); }
      })();
    </script>
  </body>
</html>
