<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>维护 · Atri控制台</title>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="nav.js"></script>
    <style>
      :root { --line:#232a35; --text:#d7dee9; --dim:#7d8899; --accent:#7dd3fc;
              --ok:#4ade80; --warn:#f5c26b; --bad:#ff7b72;
              --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      * { box-sizing:border-box; }
      html, body { height:100%; margin:0; }
      body { color:var(--text); font:13px/1.55 var(--mono); display:flex; flex-direction:column; overflow:hidden; background:#0b0e12; }
      header { display:flex; align-items:center; gap:10px; padding:10px 14px;
               background:rgba(15,19,25,.62); border-bottom:1px solid var(--line); flex:0 0 auto;
               -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); position:relative; z-index:1; }
      header h1 { font-size:13px; margin:0; color:var(--accent); font-weight:600; }
      .spacer { flex:1 1 auto; }
      button { font:inherit; font-size:12px; color:var(--text); background:rgba(27,33,43,.78);
               border:1px solid var(--line); border-radius:6px; padding:5px 11px; cursor:pointer; }
      button:hover { border-color:#3a4657; }
      button.primary { border-color:#2a5a5e; color:#a5f3fc; background:rgba(16,34,39,.8); }
      button.danger { border-color:#5a2a28; color:#ffb4ae; background:rgba(36,22,21,.8); }
      button.small { padding:3px 8px; font-size:11px; }
      .tabs { display:flex; gap:4px; overflow-x:auto; max-width:56vw; }
      .tabs button { background:transparent; border:1px solid transparent; border-radius:999px;
                     padding:4px 10px; color:var(--dim); white-space:nowrap; }
      .tabs button.active { color:var(--accent); border-color:#24505f; background:rgba(16,34,39,.72); }
      main { flex:1 1 auto; min-height:0; display:flex; gap:12px; padding:14px; overflow:auto;
             background: radial-gradient(125% 95% at 50% 0%, rgba(9,13,19,.30) 0%, rgba(8,10,14,.68) 52%, rgba(7,9,12,.86) 100%),
                         #0b0e12 url("./bg.jpg") center / cover no-repeat; }
      aside { flex:0 0 210px; overflow:auto; background:rgba(19,24,31,.62); border:1px solid var(--line);
              border-radius:10px; padding:8px; }
      aside button { display:block; width:100%; text-align:left; margin-bottom:4px; background:transparent; border:1px solid transparent; }
      aside button.active { border-color:#24505f; background:rgba(16,34,39,.55); color:var(--accent); }
      .col { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px; }
      .card { background:rgba(19,24,31,.62); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
      .card h2 { font-size:13px; margin:0 0 6px; }
      .row { display:flex; align-items:center; gap:10px; padding:5px 0; }
      .row label { min-width:170px; font-size:12.5px; }
      .row .hint { color:var(--dim); font-size:11px; }
      input[type="checkbox"] { width:16px; height:16px; accent-color:#7dd3fc; }
      input[type="text"], textarea {
        background:rgba(10,14,20,.7); border:1px solid var(--line); border-radius:6px;
        color:var(--text); padding:5px 8px; font:inherit; font-size:12px; width:100%;
      }
      textarea { min-height:420px; resize:vertical; line-height:1.6; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:10px; }
      .stat { background:rgba(19,24,31,.62); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
      .stat .k { color:var(--dim); font-size:11.5px; }
      .stat .v { font-size:20px; color:var(--text); }
      .item { background:rgba(19,24,31,.62); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
      .item .top { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
      .item .meta { color:var(--dim); font-size:11px; margin-top:4px; }
      #status { font-size:12px; } #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
      #banner { display:none; margin:0; padding:9px 12px; border:1px solid #5a3d22;
                background:#251a10; color:var(--warn); border-radius:8px; font-size:12px; }
      #banner.show { display:block; }
      table { width:100%; border-collapse:collapse; }
      td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12px; }
      th { color:var(--dim); font-weight:500; }

      /* ── 窄屏（手机）适配 ── */
      @media (max-width: 720px) {
        header { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
        header h1 { font-size: 12px; flex: 0 0 auto; }
        .tabs {
          order: 9; width: 100%; max-width: 100%;
          -webkit-overflow-scrolling: touch;
        }
        .tabs button { padding: 6px 12px; font-size: 12px; }
        main { flex-direction: column; padding: 10px; gap: 10px; }
        aside { flex: 0 0 auto; max-height: 26vh; width: 100%; }
        .grid { grid-template-columns: 1fr; }
        .row { flex-wrap: wrap; }
        .row label { flex: 1 1 100%; min-width: 0; }
        .row input[type="number"] { width: 110px; }
        .row input[type="text"] { flex: 1 1 100%; }
        .card, .item, .stat { padding: 10px 11px; }
        textarea { min-height: 220px; }
        .pane { flex: 1 1 auto !important; }
        .pane.p1, .pane.p2 { flex: 0 0 auto !important; max-height: 20vh; }
        pre.check { max-height: 42vh; }
        #cards { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>维护</h1>
      <nav class="tabs" id="tabs"></nav>
      <span class="spacer"></span>
      <span id="status"></span>
      
    </header>
    <main>
      <section class="col">
        <div id="banner"></div>
        <div class="card">
          <h2>日志</h2>
          <div id="logInfo" class="hint">读取中…</div>
        </div>
        <div class="card">
          <h2>备份</h2>
          <p class="hint">点「立刻备份」会跑 scripts\qqbot-backup.cmd（独立窗口，约 30–60 秒）</p>
          <button class="primary" id="backup">立刻备份</button>
          <table style="margin-top:10px"><thead><tr><th>文件</th><th>大小</th></tr></thead><tbody id="backups"></tbody></table>
        </div>
      </section>
</main>
    <script>
        function selfNavigate(page){ if(window.__NAV__ && window.__NAV__[page]){ location.href = window.__NAV__[page]; } }

      (function () {
        "use strict";

        var PAGES = [
          ["status","状态"],["logs","日志"],["ops","运维"],["groups","群聊"],
          ["memory","记忆"],["slang","梗库"],["content","内容"],["maint","维护"],
          ["period","时段"],["growth","成长"],["persona","角色卡"],["star","心穹中枢"]
        ];
        var CURRENT = "maint", PLUGIN = "astrbot_plugin_console", bridge = null;
        var bannerEl = document.getElementById("banner");
        function banner(t){ bannerEl.textContent=t; bannerEl.classList.add("show"); }
        function clearBanner(){ bannerEl.classList.remove("show"); }
        function setStatus(t, tone){ var e=document.getElementById("status"); e.textContent=t||""; e.className=tone||""; }
        function renderTabs(){
          var nav=document.getElementById("tabs");
          PAGES.forEach(function(pair){
            var b=document.createElement("button"); b.type="button"; b.textContent=pair[1];
            if(pair[0]===CURRENT) b.classList.add("active");
            b.addEventListener("click", function(){
              try { selfNavigate(pair[0]); }
              catch(e){ banner("宿主不允许切换页面："+e); }
            });
            nav.appendChild(b);
          });
        }
        function bootBridge(start, attempt){
          attempt = attempt || 0;
          bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
          if(!bridge){
            if(attempt < 30){ setTimeout(function(){ bootBridge(start, attempt+1); }, 100); return; }
            banner("没有检测到 AstrBot 页面桥 —— 请从 WebUI → 扩展功能 → Atri控制台 进入。");
            return;
          }
          renderTabs();
          if(typeof bridge.ready === "function"){
            Promise.race([bridge.ready(), new Promise(function(r){ setTimeout(r, 1500); })]).finally(start);
          } else { start(); }
        }


        function fmt(n){ n=Number(n)||0; return n<1024?n+" B":(n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"); }
        async function load(){
          setStatus("读取中…");
          try{
            var d=await bridge.apiGet("maint");
            document.getElementById("logInfo").textContent =
              (d.log_file||"") + " · " + fmt(d.log_size) + "（日志页可实时看）";
            var tb=document.getElementById("backups"); tb.replaceChildren();
            (d.backups||[]).forEach(function(b){
              var tr=document.createElement("tr");
              var td1=document.createElement("td"); td1.textContent=b.name;
              var td2=document.createElement("td"); td2.textContent=fmt(b.size);
              tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
            });
            if(!(d.backups||[]).length){
              var tr=document.createElement("tr"); var td=document.createElement("td");
              td.colSpan=2; td.textContent="archive 里没有 qqbot-backup-*.zip"; tr.appendChild(td); tb.appendChild(tr);
            }
            clearBanner(); setStatus("");
          }catch(e){ banner("读取失败："+(e&&e.message?e.message:e)); setStatus(""); }
        }
        async function backup(){
          if(!confirm("现在跑一次备份？会弹一个独立窗口。")) return;
          setStatus("已下发…");
          try{
            await bridge.apiPost("maint/backup", { confirm: "backup" });
            setStatus("备份已启动，稍后刷新看结果","ok");
            setTimeout(load, 8000);
          }catch(e){ setStatus("启动失败","bad"); banner("启动失败："+(e&&e.message?e.message:e)); }
        }


          document.getElementById("backup").addEventListener("click", backup);
          bootBridge(load);

      })();
    </script>
  </body>
</html>
